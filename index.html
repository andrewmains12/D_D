<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brick Breaker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
    }
    #ui {
      display: flex;
      gap: 40px;
      margin-bottom: 10px;
      font-size: 18px;
      letter-spacing: 2px;
    }
    #ui span { color: #aaf; }
    canvas {
      border: 2px solid #334;
      background: #050510;
      display: block;
      max-width: 100vw;
      touch-action: none;
    }
    #message {
      margin-top: 12px;
      font-size: 16px;
      color: #88f;
      height: 24px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>SCORE: <span id="scoreDisplay">0</span></div>
    <div>LIVES: <span id="livesDisplay">3</span></div>
    <div>LEVEL: <span id="levelDisplay">1</span></div>
  </div>
  <canvas id="canvas" width="600" height="500"></canvas>
  <div id="message">Tap or press SPACE to start</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreDisplay');
const livesEl = document.getElementById('livesDisplay');
const levelEl = document.getElementById('levelDisplay');
const msgEl = document.getElementById('message');

const W = canvas.width;
const H = canvas.height;

const paddle = { w: 90, h: 12, x: 0, y: H - 40, speed: 7 };
paddle.x = (W - paddle.w) / 2;

const BALL_R = 7;
let ball = { x: 0, y: 0, vx: 0, vy: 0 };

const BRICK_COLS = 10;
const BRICK_ROWS = 6;
const BRICK_W = 52;
const BRICK_H = 18;
const BRICK_PAD = 4;
const BRICK_TOP = 50;
const BRICK_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD)) / 2;

const ROW_CONFIG = [
  { color: '#ff4466', pts: 70 },
  { color: '#ff8844', pts: 50 },
  { color: '#ffdd00', pts: 40 },
  { color: '#44dd44', pts: 30 },
  { color: '#44aaff', pts: 20 },
  { color: '#9966ff', pts: 10 },
];

let bricks = [];
let score = 0;
let lives = 3;
let level = 1;
let gameState = 'idle';
let keys = {};

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); handleStart(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('click', handleStart);
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const mx = (e.clientX - rect.left) * scaleX;
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleStart();
  movePaddleToTouch(e.touches[0]);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  movePaddleToTouch(e.touches[0]);
}, { passive: false });

function movePaddleToTouch(touch) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const mx = (touch.clientX - rect.left) * scaleX;
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
}

function resizeCanvas() {
  const maxW = Math.min(window.innerWidth, 600);
  canvas.style.width = maxW + 'px';
  canvas.style.height = (maxW * (500 / 600)) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function handleStart() {
  if (gameState === 'idle' || gameState === 'won' || gameState === 'lost') {
    if (gameState === 'won') level++;
    if (gameState === 'lost') { lives = 3; score = 0; level = 1; }
    initLevel(); // lands in 'serve' state
  } else if (gameState === 'serve') {
    launch();
    gameState = 'playing';
    msgEl.textContent = '';
  }
}

function initLevel() {
  buildBricks();
  resetBall();
  updateUI();
}

function buildBricks() {
  bricks = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      let hp = (level >= 3 && r < 2) ? 2 : 1;
      bricks.push({
        x: BRICK_LEFT + c * (BRICK_W + BRICK_PAD),
        y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
        w: BRICK_W, h: BRICK_H,
        hp, maxHp: hp,
        pts: ROW_CONFIG[r].pts,
        color: ROW_CONFIG[r].color,
        alive: true,
      });
    }
  }
}

function resetBall() {
  ball.x = W / 2;
  ball.y = paddle.y - BALL_R - 2;
  ball.vx = 0;
  ball.vy = 0;
  gameState = 'serve';
  msgEl.textContent = 'Tap or press SPACE to launch';
}

function launch() {
  const speed = 4 + level * 0.4;
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * (Math.PI / 4);
  ball.vx = speed * Math.cos(angle);
  ball.vy = speed * Math.sin(angle);
}

function updateUI() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  levelEl.textContent = level;
}

function ballHitRect(bx, by, rx, ry, rw, rh) {
  const nearX = Math.max(rx, Math.min(bx, rx + rw));
  const nearY = Math.max(ry, Math.min(by, ry + rh));
  const dx = bx - nearX;
  const dy = by - nearY;
  return dx * dx + dy * dy < BALL_R * BALL_R;
}

function resolveHit(bx, by, rx, ry, rw, rh) {
  const overlapL = (bx + BALL_R) - rx;
  const overlapR = (rx + rw) - (bx - BALL_R);
  const overlapT = (by + BALL_R) - ry;
  const overlapB = (ry + rh) - (by - BALL_R);
  const minH = Math.min(overlapL, overlapR);
  const minV = Math.min(overlapT, overlapB);
  if (minH < minV) { ball.vx = -ball.vx; } else { ball.vy = -ball.vy; }
}

function update() {
  if (gameState !== 'playing') return;

  if (keys['ArrowLeft']) paddle.x = Math.max(0, paddle.x - paddle.speed);
  if (keys['ArrowRight']) paddle.x = Math.min(W - paddle.w, paddle.x + paddle.speed);

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
  if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

  if (ball.y - BALL_R > H) {
    lives--;
    updateUI();
    if (lives <= 0) {
      gameState = 'lost';
      msgEl.textContent = 'GAME OVER — Tap to restart';
    } else {
      resetBall();
    }
    return;
  }

  if (ballHitRect(ball.x, ball.y, paddle.x, paddle.y, paddle.w, paddle.h) && ball.vy > 0) {
    ball.vy = -Math.abs(ball.vy);
    const hitPos = (ball.x - paddle.x) / paddle.w;
    ball.vx = (hitPos - 0.5) * 6;
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    const targetSpeed = 4 + level * 0.4;
    ball.vx = (ball.vx / speed) * targetSpeed;
    ball.vy = (ball.vy / speed) * targetSpeed;
  }

  let bricksLeft = 0;
  for (const b of bricks) {
    if (!b.alive) continue;
    bricksLeft++;
    if (ballHitRect(ball.x, ball.y, b.x, b.y, b.w, b.h)) {
      resolveHit(ball.x, ball.y, b.x, b.y, b.w, b.h);
      b.hp--;
      if (b.hp <= 0) {
        b.alive = false;
        bricksLeft--;
        score += b.pts * level;
        updateUI();
      }
      break;
    }
  }

  if (bricksLeft === 0) {
    gameState = 'won';
    msgEl.textContent = 'LEVEL CLEAR! Tap for next level';
  }
}

function drawBall() {
  const grd = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, BALL_R * 2.5);
  grd.addColorStop(0, 'rgba(255,255,255,0.4)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R * 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
}

function drawPaddle() {
  const grd = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
  grd.addColorStop(0, '#88aaff');
  grd.addColorStop(1, '#3355cc');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();
}

function drawBricks() {
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.globalAlpha = b.hp < b.maxHp ? 0.5 : 1;
    const grd = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    grd.addColorStop(0, b.color);
    grd.addColorStop(1, shadeColor(b.color, -40));
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.roundRect(b.x + 2, b.y + 2, b.w - 4, 4, 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function shadeColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  drawBricks();
  drawPaddle();
  if (gameState === 'serve') {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - BALL_R - 2;
  }
  drawBall();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetBall();
gameState = 'idle';
buildBricks();
loop();
</script>
</body>
</html>
